
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VYSLO UTOPIA</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
  <header>
    <h1>VYSLO <span>UTOPIA</span></h1>
  </header>

  <main>
    <form id="address-form">
      <input id="address" type="text" placeholder="URLまたは検索ワードを入力" required>
      <button type="submit">開く ↗</button>
    </form>

    <nav>
      <button type="button" data-url="https://www.wikipedia.org/">Wikipedia</button>
      <button type="button" data-url="https://www.youtube.com/">YouTube</button>
      <button type="button" data-url="https://example.com/">Example</button>
    </nav>

    <section class="browser">
      <div class="toolbar">
        <button id="back" type="button" disabled>←</button>
        <button id="forward" type="button" disabled>→</button>
        <button id="reload" type="button" disabled>↻</button>
        <span id="current-address">ここにページが表示されるよ</span>
        <a id="open-new" href="https://example.com/" target="_blank" rel="noopener noreferrer">新しいタブ ↗</a>
      </div>

      <p id="notice">URLを入力して「開く」を押してね。</p>

      <div id="empty">
        <h2>次のページを開こう</h2>
        <p>対応しているWebサイトやYouTubeをここに表示するよ。</p>
      </div>

      <div id="viewer-wrap" hidden>
        <iframe id="viewer" title="Webページ表示" hidden></iframe>
        <div id="youtube-frame" hidden></div>
      </div>
    </section>
  </main>
</body>
</html>
